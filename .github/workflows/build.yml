name: Build ZMK firmware

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: zmkfirmware/zmk-build-arm:stable
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache ZMK dependencies
        uses: actions/cache@v6
        with:
          path: |
            bootloader/
            modules/
            tools/
            zephyr/
            zmk/
          key: zmk-deps-${{ hashFiles('config/west.yml') }}
      - name: Prepare the ZMK workspace
        run: |
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
      - name: Build the UF2 files
        run: |
          python3 - <<'PY'
          import shlex
          import shutil
          import subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory

          import yaml

          config_path = Path("config").resolve()
          targets = yaml.safe_load(Path("build.yaml").read_text())["include"]
          firmware_path = Path("firmware-files")
          firmware_path.mkdir()

          for target in targets:
              board = target["board"]
              shield = target["shield"]
              name = target.get("artifact-name", f"{shield}-{board}-zmk")
              cmake_args = shlex.split(target.get("cmake-args", ""))
              with TemporaryDirectory(prefix="zmk-") as build_path:
                  command = ["west", "build", "-s", "zmk/app", "-d", build_path, "-b", board]
                  if snippet := target.get("snippet"):
                      command.extend(["-S", snippet])
                  command.extend(["--", f"-DZMK_CONFIG={config_path}", f"-DSHIELD={shield}"])
                  subprocess.run([*command, *cmake_args], check=True)
                  shutil.copyfile(
                      Path(build_path) / "zephyr" / "zmk.uf2", firmware_path / f"{name}.uf2"
                  )
          PY
      - name: Publish firmware archive
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: firmware-files/*.uf2
          if-no-files-found: error
